name: Python

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.9"
          enable-cache: true
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: "1.72.0"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Check protobuf schema and generated code
        run: |
          buf lint
          buf format -d --exit-code
          buf generate
          git diff --exit-code -- decision_service/decision_pb2.py decision_service/decision_pb2_grpc.py
      - name: Run tests
        run: uv run --locked python -m pytest -q

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker buildx bake --push image
